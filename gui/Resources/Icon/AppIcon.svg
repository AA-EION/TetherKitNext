<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TetherKitNext app icon. Source of truth: gui/Scripts/make-icon.py renders
       AppIcon.icns and docs/assets/icon.png from this file. Layout follows the
       macOS icon grid: 824×824 rounded square centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A4A"/>
      <stop offset="1" stop-color="#0B1222"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC84"/>
      <stop offset="1" stop-color="#2BD4C4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#3DDC84" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#3DDC84" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- subtle top highlight -->
    <rect x="100" y="100" width="824" height="824" rx="185" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  </g>

  <g transform="translate(-33 0)">
  <!-- cable: leaves the phone, sweeps right and ends in a plug -->
  <path d="M 420 668 L 420 712 C 420 800 480 812 560 812 L 640 812 C 720 812 752 772 752 700 L 752 560"
        fill="none" stroke="url(#cable)" stroke-width="40" stroke-linecap="round"/>
  <!-- plug -->
  <rect x="712" y="444" width="80" height="112" rx="20" fill="url(#cable)"/>
  <rect x="730" y="392" width="44" height="60" rx="8" fill="#DDF7EC"/>

  <!-- phone -->
  <rect x="298" y="222" width="244" height="446" rx="56" fill="#0B1222"
        stroke="#F5F7FA" stroke-width="34"/>
  <rect x="384" y="262" width="72" height="20" rx="10" fill="#F5F7FA"/>
  <!-- sharing indicator: the phone shares its connection -->
  <circle cx="420" cy="512" r="24" fill="#3DDC84"/>
  <path d="M 370 462 A 70 70 0 0 1 470 462" fill="none" stroke="#3DDC84"
        stroke-width="22" stroke-linecap="round"/>
  <path d="M 336 424 A 118 118 0 0 1 504 424" fill="none" stroke="#3DDC84"
        stroke-width="22" stroke-linecap="round" stroke-opacity="0.75"/>
  </g>
</svg>
