# CI: build, test, package — on real macOS runners.
#
# TetherKitNext only builds on macOS (Darwin BPF, xnu's private if_fake ABI).
# GitHub's hosted macOS runners are Apple Silicon VMs, plus an Intel image
# (macos-15-intel) that we use to prove the universal binary really runs on
# x86_64 hardware, not just under Rosetta.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]  # release.yml handles tags
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: >-
          Optional. Publish this run's (ad-hoc signed) DMG as a GitHub prerelease
          under this new tag, e.g. v1.0.0-beta.4. Leave empty for a normal CI run.
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Native build + unit tests on each supported runner architecture/OS.
  # None of the tests need root or a USB device; feth/BPF cases skip themselves
  # without TETHERKITNEXT_ROOT_TESTS (the abi-check job runs them as root).
  # ----------------------------------------------------------------------------
  native:
    name: C++ · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers; uname -m; cmake --version; c++ --version

      - name: Cache libusb
        uses: actions/cache@v4
        with:
          path: build/libusb-universal
          key: libusb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libusb.sh') }}

      - name: Build libusb (universal, pinned + hash-verified)
        run: ./scripts/build-libusb.sh "$PWD/build/libusb-universal"

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLibUSB_ROOT="$PWD/build/libusb-universal" \
            -DTETHERKITNEXT_WARNINGS_AS_ERRORS=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke (--list needs no root)
        run: |
          ./build/bin/tetherkitnext-cli --version
          ./build/bin/tetherkitnext-cli --list

  # ----------------------------------------------------------------------------
  # The shipping build: universal C++ + Swift, app bundle, DMG.
  #
  # Signed + notarized when the repository has signing secrets and the run is
  # not from a fork's pull request (GitHub withholds secrets there); otherwise
  # ad-hoc signed so the pipeline is still fully exercised.
  # ----------------------------------------------------------------------------
  package:
    name: Universal app + DMG
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version; swift --version

      - name: Import signing certificate
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build, test, package
        env:
          TETHERKITNEXT_BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/build-release.sh

      - name: Swift unit tests
        run: TETHERKITNEXT_LIB_DIR="$PWD/build-release/lib" swift test --package-path gui

      - name: Bundle checks
        run: |
          app=dist/TetherKitNext.app
          codesign --display --verbose=2 "$app" 2>&1 | sed -n '1,12p'
          for f in "$app/Contents/MacOS/"* "$app/Contents/Frameworks/"*; do
            printf '%-60s %s\n' "${f#dist/}" "$(lipo -archs "$f")"
          done
          # The daemon refuses to run outside launchd (and the legacy
          # --install setuid mode is gone): it must exit non-zero, promptly.
          if perl -e 'alarm 10; exec @ARGV' "$app/Contents/MacOS/tetherkitnext-helper" --install; then
            echo "::error::tetherkitnext-helper ran outside launchd"; exit 1
          fi
          plutil -p "$app/Contents/Library/LaunchDaemons/com.tetherkitnext.helperd.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: TetherKitNext-dmg
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Install the DMG on a real Intel Mac and run the CLI from it.
  # ----------------------------------------------------------------------------
  intel-smoke:
    name: DMG on Intel
    needs: package
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TetherKitNext-dmg
      - name: Mount, copy to /Applications, run
        run: |
          uname -m
          dmg="$(ls TetherKitNext-*.dmg)"
          mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')"
          ditto "$mnt/TetherKitNext.app" /Applications/TetherKitNext.app
          hdiutil detach "$mnt"
          app=/Applications/TetherKitNext.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/tetherkitnext-cli" --version
          "$app/Contents/MacOS/tetherkitnext-cli" --list
          # Launch the GUI briefly: proves the x86_64 Swift slice + dylibs load.
          "$app/Contents/MacOS/TetherKitNext" & pid=$!
          sleep 8
          kill -0 "$pid" || { echo "::error::GUI exited early on Intel"; exit 1; }
          kill "$pid"

  # ----------------------------------------------------------------------------
  # What people see when they open the DMG: mount it in Finder and take a
  # screenshot (the install layout lives in .DS_Store, which nothing else
  # checks). Also shoots the latest published release for comparison.
  # Diagnostic only: never fails the build.
  # ----------------------------------------------------------------------------
  dmg-look:
    name: DMG window · ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TetherKitNext-dmg
          path: built
      - name: Latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R "$GITHUB_REPOSITORY" --pattern '*.dmg' --dir released \
            || echo "no published DMG"
      - uses: actions/checkout@v5
        with:
          path: src
      - name: Open in Finder and screenshot
        run: |
          mkdir -p shots
          shoot() {
            local dmg="$1" name="$2" mnt
            mnt="$(hdiutil attach -readonly -noautoopen "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')"
            echo "== $name: $mnt"
            ls -la "$mnt"
            open "$mnt"
            sleep 8
            osascript -e 'tell application "Finder" to get {name, bounds, current view} of front window' || true
            osascript -e "tell application \"Finder\" to get background picture of icon view options of container window of disk \"$(basename "$mnt")\"" || true
            screencapture -x "shots/$name.png" || true
            osascript -e 'tell application "Finder" to close every window' || true
            hdiutil detach "$mnt" || hdiutil detach -force "$mnt"
            sleep 2
          }
          sw_vers
          for dmg in built/*.dmg; do shoot "$dmg" "a-ci-build"; done
          for dmg in released/*.dmg; do [ -f "$dmg" ] && shoot "$dmg" "published-release"; done

          # B: let Finder itself point the window at the background (what
          # create-dmg and most hand-made DMGs do), starting from our DMG.
          dmg="$(ls built/*.dmg | head -1)"
          hdiutil convert "$dmg" -format UDRW -o rw.dmg -quiet
          hdiutil resize -size 200m rw.dmg || true
          mnt="$(hdiutil attach -readwrite -noautoopen rw.dmg | awk -F'\t' '/\/Volumes\// {print $NF}')"
          vol="$(basename "$mnt")"
          rm -f "$mnt/.DS_Store"
          mkdir -p "$mnt/.background"
          cp src/scripts/dmg/background.png "$mnt/.background/background.png"
          osascript <<APPLESCRIPT || true
          tell application "Finder"
            tell disk "$vol"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {200, 140, 860, 540}
              set opts to icon view options of container window
              set arrangement of opts to not arranged
              set icon size of opts to 128
              set background picture of opts to file ".background:background.png"
              set position of item "TetherKitNext.app" of container window to {170, 190}
              set position of item "Applications" of container window to {490, 190}
              update without registering applications
              delay 2
              close
            end tell
          end tell
          APPLESCRIPT
          sync; sleep 2
          ls -la "$mnt"
          hdiutil detach "$mnt" || hdiutil detach -force "$mnt"
          hdiutil convert rw.dmg -format UDZO -o finder-set.dmg -quiet
          shoot finder-set.dmg "b-finder-set"

          # C: dmgbuild with a plain PNG instead of the multi-resolution TIFF.
          mnt="$(hdiutil attach -readonly -noautoopen "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')"
          ditto "$mnt/TetherKitNext.app" app/TetherKitNext.app
          hdiutil detach "$mnt"
          python3 -m venv venv && venv/bin/pip install --quiet "dmgbuild==1.6.5"
          venv/bin/dmgbuild -s src/scripts/dmg/settings.py -D app="$PWD/app/TetherKitNext.app" \
            -D background="$PWD/src/scripts/dmg/background.png" "$vol" png.dmg
          shoot png.dmg "c-dmgbuild-png"
          ls -l shots
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-window-${{ matrix.os }}
          path: shots/*.png
          if-no-files-found: warn

  # ----------------------------------------------------------------------------
  # ThreadSanitizer: the lock-free rings and the park/wake handshake.
  # ----------------------------------------------------------------------------
  tsan:
    name: ThreadSanitizer
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build libusb
        run: ./scripts/build-libusb.sh "$PWD/build-tsan/libusb-universal"
      - name: Configure & build
        run: |
          cmake -S . -B build-tsan -DTETHERKITNEXT_ENABLE_TSAN=ON \
            -DLibUSB_ROOT="$PWD/build-tsan/libusb-universal" -DTETHERKITNEXT_BUILD_BENCHMARKS=OFF
          cmake --build build-tsan -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure

  # ----------------------------------------------------------------------------
  # Private ABI drift gate: create/destroy a real feth pair as root.
  #
  # The biggest long-term risk is xnu changing struct if_fake_request. This job
  # is a gate, not a signal: skipped root tests must fail it.
  # ----------------------------------------------------------------------------
  abi-check:
    name: feth ABI · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          ./scripts/build-libusb.sh "$PWD/build/libusb-universal"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLibUSB_ROOT="$PWD/build/libusb-universal" -DTETHERKITNEXT_BUILD_BENCHMARKS=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Disable feth hardware checksum offload
        run: sudo sysctl -w net.link.fake.hwcsum=0
      - name: Run feth/BPF cases as root
        run: |
          # Pin the log language: the gate greps for a message text.
          sudo env TETHERKITNEXT_ROOT_TESTS=1 TETHERKITNEXT_LANG=en \
            ctest --test-dir build -V -R 'net\.' 2>&1 | tee abi.log
          # Skip notice is hard-coded in tests/test_net_link.cc.
          if grep -q "需要 root 且需设置" abi.log; then
            echo "::error::feth cases were skipped; the ABI check did not run"; exit 1
          fi
          # kNetCreated. (The previous gate grepped for "创建了 feth", a string
          # that stopped existing when log messages were localized — it could
          # never pass.)
          if ! grep -q "created virtual interface feth" abi.log; then
            echo "::error::no feth creation in the log; cannot confirm the private ABI"; exit 1
          fi
          echo "✓ $(grep -m1 'created virtual interface feth' abi.log)"

  # ----------------------------------------------------------------------------
  # Optional: publish the tested DMG as a prerelease (manual runs only).
  #
  # Uses exactly the artifact the package job built and the Intel job installed
  # and ran. It is ad-hoc signed unless signing secrets exist; signed,
  # notarized stable releases go through release.yml.
  # ----------------------------------------------------------------------------
  publish-prerelease:
    name: Publish prerelease ${{ inputs.prerelease_tag }}
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease_tag != ''
    needs: [package, intel-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        env:
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-[0-9A-Za-z.]+$ ]] \
            || { echo "::error::prerelease tags look like v1.2.3-beta.1"; exit 1; }
          version="$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          [ "${BASH_REMATCH[1]}" = "$version" ] \
            || { echo "::error::tag ${TAG} does not match CMakeLists VERSION ${version}"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: TetherKitNext-dmg
          path: artifact

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          dmg="$(ls artifact/TetherKitNext-*.dmg)"
          {
            echo '> [!WARNING]'
            echo '> **Test build: not signed with a Developer ID and not notarized by Apple.**'
            echo '> macOS will block it the first time. After copying TetherKitNext to Applications,'
            echo '> open *System Settings › Privacy & Security* and click **Open Anyway**, or run:'
            echo '> `xattr -dr com.apple.quarantine /Applications/TetherKitNext.app`'
            echo '>'
            echo '> Because it is not signed with a real certificate, macOS may refuse to enable the'
            echo '> background component. `sudo /Applications/TetherKitNext.app/Contents/MacOS/tetherkitnext-cli`'
            echo '> works regardless.'
            echo
            echo '## Install'
            echo
            echo "1. Download **$(basename "$dmg")**, open it and drag **TetherKitNext** to **Applications**."
            echo '2. Open TetherKitNext and click **Enable Background Component**; allow it once in'
            echo '   *System Settings › General › Login Items & Extensions*.'
            echo '3. Plug in your phone, turn on USB tethering, click **Connect**.'
            echo
            echo '### Coming from TetherKit 0.2.0 (beta 1–3)?'
            echo
            echo 'TetherKitNext is installed next to the old **TetherKit** app, not over it. Remove the old'
            echo 'one first so the two do not fight over the phone:'
            echo '[upgrade steps](https://github.com/AA-EION/TetherKitNext#upgrading-from-tetherkit-020-betas).'
            echo
            echo 'Universal build (Apple Silicon + Intel), macOS 14 or later.'
            echo
            echo "SHA-256: \`$(sha256sum "$dmg" | awk '{print $1}')\`"
          } > notes.md
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "TetherKitNext ${TAG} (test build)" \
            --notes-file notes.md --generate-notes "$dmg"
          echo "Published: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
