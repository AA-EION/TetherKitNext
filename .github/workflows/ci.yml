# CI: build, test, package — on real macOS runners.
#
# TetherKit only builds on macOS (Darwin BPF, xnu's private if_fake ABI).
# GitHub's hosted macOS runners are Apple Silicon VMs, plus an Intel image
# (macos-15-intel) that we use to prove the universal binary really runs on
# x86_64 hardware, not just under Rosetta.

name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]  # release.yml handles tags
  pull_request:
  workflow_dispatch:
    inputs:
      prerelease_tag:
        description: >-
          Optional. Publish this run's (ad-hoc signed) DMG as a GitHub prerelease
          under this new tag, e.g. v0.2.0-beta.1. Leave empty for a normal CI run.
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Native build + unit tests on each supported runner architecture/OS.
  # None of the tests need root or a USB device; feth/BPF cases skip themselves
  # without TETHERKIT_ROOT_TESTS (the abi-check job runs them as root).
  # ----------------------------------------------------------------------------
  native:
    name: C++ · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          sw_vers; uname -m; cmake --version; c++ --version

      - name: Cache libusb
        uses: actions/cache@v4
        with:
          path: build/libusb-universal
          key: libusb-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-libusb.sh') }}

      - name: Build libusb (universal, pinned + hash-verified)
        run: ./scripts/build-libusb.sh "$PWD/build/libusb-universal"

      - name: Configure & build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLibUSB_ROOT="$PWD/build/libusb-universal" \
            -DTETHERKIT_WARNINGS_AS_ERRORS=ON
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke (--list needs no root)
        run: |
          ./build/bin/tetherkit-cli --version
          ./build/bin/tetherkit-cli --list

  # ----------------------------------------------------------------------------
  # The shipping build: universal C++ + Swift, app bundle, DMG.
  #
  # Signed + notarized when the repository has signing secrets and the run is
  # not from a fork's pull request (GitHub withholds secrets there); otherwise
  # ad-hoc signed so the pipeline is still fully exercised.
  # ----------------------------------------------------------------------------
  package:
    name: Universal app + DMG
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version; swift --version

      - name: Import signing certificate
        if: github.event_name != 'pull_request'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build, test, package
        env:
          TETHERKIT_BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/build-release.sh

      - name: Swift unit tests
        run: TETHERKIT_LIB_DIR="$PWD/build-release/lib" swift test --package-path gui

      - name: Bundle checks
        run: |
          app=dist/TetherKit.app
          codesign --display --verbose=2 "$app" 2>&1 | sed -n '1,12p'
          for f in "$app/Contents/MacOS/"* "$app/Contents/Frameworks/"*; do
            printf '%-60s %s\n' "${f#dist/}" "$(lipo -archs "$f")"
          done
          # The daemon refuses to run outside launchd (and the legacy
          # --install setuid mode is gone): it must exit non-zero, promptly.
          if perl -e 'alarm 10; exec @ARGV' "$app/Contents/MacOS/tetherkit-helper" --install; then
            echo "::error::tetherkit-helper ran outside launchd"; exit 1
          fi
          plutil -p "$app/Contents/Library/LaunchDaemons/com.tetherkit.helperd.plist"

      - uses: actions/upload-artifact@v4
        with:
          name: TetherKit-dmg
          path: |
            dist/*.dmg
            dist/*.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------------------
  # Install the DMG on a real Intel Mac and run the CLI from it.
  # ----------------------------------------------------------------------------
  intel-smoke:
    name: DMG on Intel
    needs: package
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TetherKit-dmg
      - name: Mount, copy to /Applications, run
        run: |
          uname -m
          dmg="$(ls TetherKit-*.dmg)"
          mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// {print $NF}')"
          ditto "$mnt/TetherKit.app" /Applications/TetherKit.app
          hdiutil detach "$mnt"
          app=/Applications/TetherKit.app
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/tetherkit-cli" --version
          "$app/Contents/MacOS/tetherkit-cli" --list
          # Launch the GUI briefly: proves the x86_64 Swift slice + dylibs load.
          "$app/Contents/MacOS/TetherKit" & pid=$!
          sleep 8
          kill -0 "$pid" || { echo "::error::GUI exited early on Intel"; exit 1; }
          kill "$pid"

  # ----------------------------------------------------------------------------
  # ThreadSanitizer: the lock-free rings and the park/wake handshake.
  # ----------------------------------------------------------------------------
  tsan:
    name: ThreadSanitizer
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Build libusb
        run: ./scripts/build-libusb.sh "$PWD/build-tsan/libusb-universal"
      - name: Configure & build
        run: |
          cmake -S . -B build-tsan -DTETHERKIT_ENABLE_TSAN=ON \
            -DLibUSB_ROOT="$PWD/build-tsan/libusb-universal" -DTETHERKIT_BUILD_BENCHMARKS=OFF
          cmake --build build-tsan -j"$(sysctl -n hw.ncpu)"
      - name: Test
        run: ctest --test-dir build-tsan --output-on-failure

  # ----------------------------------------------------------------------------
  # Private ABI drift gate: create/destroy a real feth pair as root.
  #
  # The biggest long-term risk is xnu changing struct if_fake_request. This job
  # is a gate, not a signal: skipped root tests must fail it.
  # ----------------------------------------------------------------------------
  abi-check:
    name: feth ABI · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          ./scripts/build-libusb.sh "$PWD/build/libusb-universal"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DLibUSB_ROOT="$PWD/build/libusb-universal" -DTETHERKIT_BUILD_BENCHMARKS=OFF
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Disable feth hardware checksum offload
        run: sudo sysctl -w net.link.fake.hwcsum=0
      - name: Run feth/BPF cases as root
        run: |
          # Pin the log language: the gate greps for a message text.
          sudo env TETHERKIT_ROOT_TESTS=1 TETHERKIT_LANG=en \
            ctest --test-dir build -V -R 'net\.' 2>&1 | tee abi.log
          # Skip notice is hard-coded in tests/test_net_link.cc.
          if grep -q "需要 root 且需设置" abi.log; then
            echo "::error::feth cases were skipped; the ABI check did not run"; exit 1
          fi
          # kNetCreated. (The previous gate grepped for "创建了 feth", a string
          # that stopped existing when log messages were localized — it could
          # never pass.)
          if ! grep -q "created virtual interface feth" abi.log; then
            echo "::error::no feth creation in the log; cannot confirm the private ABI"; exit 1
          fi
          echo "✓ $(grep -m1 'created virtual interface feth' abi.log)"

  # ----------------------------------------------------------------------------
  # Optional: publish the tested DMG as a prerelease (manual runs only).
  #
  # Uses exactly the artifact the package job built and the Intel job installed
  # and ran. It is ad-hoc signed unless signing secrets exist; signed,
  # notarized stable releases go through release.yml.
  # ----------------------------------------------------------------------------
  publish-prerelease:
    name: Publish prerelease ${{ inputs.prerelease_tag }}
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease_tag != ''
    needs: [package, intel-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag
        env:
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-[0-9A-Za-z.]+$ ]] \
            || { echo "::error::prerelease tags look like v1.2.3-beta.1"; exit 1; }
          version="$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          [ "${BASH_REMATCH[1]}" = "$version" ] \
            || { echo "::error::tag ${TAG} does not match CMakeLists VERSION ${version}"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          name: TetherKit-dmg
          path: artifact

      - name: Create prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.prerelease_tag }}
        run: |
          dmg="$(ls artifact/TetherKit-*.dmg)"
          {
            echo '> [!WARNING]'
            echo '> **Test build: not signed with a Developer ID and not notarized by Apple.**'
            echo '> macOS will block it the first time. After copying TetherKit to Applications,'
            echo '> open *System Settings › Privacy & Security* and click **Open Anyway**, or run:'
            echo '> `xattr -dr com.apple.quarantine /Applications/TetherKit.app`'
            echo '>'
            echo '> Because it is not signed with a real certificate, macOS may refuse to enable the'
            echo '> background component. `sudo /Applications/TetherKit.app/Contents/MacOS/tetherkit-cli`'
            echo '> works regardless.'
            echo
            echo '## Install'
            echo
            echo "1. Download **$(basename "$dmg")**, open it and drag **TetherKit** to **Applications**."
            echo '2. Open TetherKit and click **Enable Background Component**; allow it once in'
            echo '   *System Settings › General › Login Items & Extensions*.'
            echo '3. Plug in your phone, turn on USB tethering, click **Connect**.'
            echo
            echo 'Universal build (Apple Silicon + Intel), macOS 14 or later.'
            echo
            echo "SHA-256: \`$(sha256sum "$dmg" | awk '{print $1}')\`"
          } > notes.md
          gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "TetherKit ${TAG} (test build)" \
            --notes-file notes.md --generate-notes "$dmg"
          echo "Published: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
