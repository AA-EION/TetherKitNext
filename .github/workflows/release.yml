# Release: push a v* tag to publish a DMG.
#
#   Stable:      git tag -a v1.0.0 -m "TetherKitNext 1.0.0"        && git push origin v1.0.0
#   Prerelease:  git tag -a v1.0.0-beta.5 -m "TetherKitNext 1.0.0 beta 5" && git push origin v1.0.0-beta.5
#
# A tag with a suffix after the version (v1.0.0-beta.5, v1.0.0-rc.1) publishes a
# GitHub *prerelease*. Prereleases may be built without signing secrets: the
# DMG is then ad-hoc signed and not notarized, and only the DMG is uploaded.
#
# Stable tags require these repository secrets and refuse to publish without
# them (an unsigned DMG is blocked by Gatekeeper on every user's Mac):
#   MACOS_CERTIFICATE_P12        base64 of "Developer ID Application" cert + key (.p12)
#   MACOS_CERTIFICATE_PASSWORD   .p12 export password
#   NOTARY_KEY_P8                base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID                that key's ID
#   NOTARY_ISSUER_ID             App Store Connect issuer ID

name: Release

on:
  push:
    tags: ["v*"]
  # Manual run from the Actions tab (or the API): builds the selected branch
  # and creates the tag on that exact commit when publishing. Useful when tags
  # cannot be pushed directly.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and publish, e.g. v1.0.0-rc.1"
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ inputs.tag || github.ref_name }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Check if release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; skipping CI build."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Classify tag; version must match CMakeLists VERSION
        if: steps.existing.outputs.exists != 'true'
        id: tag
        run: |
          case "$RELEASE_TAG" in v[0-9]*) ;; *) echo "::error::tag must look like v1.2.3[-suffix]"; exit 1 ;; esac
          tag_ver="${RELEASE_TAG#v}"
          base_ver="${tag_ver%%-*}"
          cmake_ver=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          echo "tag=${tag_ver} base=${base_ver} CMakeLists.txt=${cmake_ver}"
          [ "$base_ver" = "$cmake_ver" ] || { echo "::error::tag and VERSION differ"; exit 1; }
          if [ "$tag_ver" != "$base_ver" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing secrets
        if: steps.existing.outputs.exists != 'true'
        id: signing
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          if [ "$HAS_CERT" = true ] && [ "$HAS_NOTARY" = true ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$PRERELEASE" = true ]; then
            echo "::warning::No signing secrets: publishing an ad-hoc signed, un-notarized prerelease"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Stable releases need MACOS_CERTIFICATE_P12 and the NOTARY_* secrets"
            exit 1
          fi

      - name: Select the newest Xcode
        if: steps.existing.outputs.exists != 'true'
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version

      - name: Import signing certificate
        if: steps.existing.outputs.exists != 'true' && steps.signing.outputs.signed == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build, test, package
        if: steps.existing.outputs.exists != 'true'
        env:
          TETHERKITNEXT_BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.NOTARY_KEY_ID || '' }}
          NOTARY_ISSUER_ID: ${{ steps.signing.outputs.signed == 'true' && secrets.NOTARY_ISSUER_ID || '' }}
        run: ./scripts/build-release.sh

      - name: Swift unit tests
        if: steps.existing.outputs.exists != 'true'
        run: TETHERKITNEXT_LIB_DIR="$PWD/build-release/lib" swift test --package-path gui

      - name: Release notes
        if: steps.existing.outputs.exists != 'true'
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          dmg="$(ls dist/TetherKitNext-*.dmg)"
          dmg_name="$(basename "$dmg")"
          sha256="$(shasum -a 256 "$dmg" | awk '{print $1}')"
          {
            if [ "$SIGNED" != true ]; then
              echo '> [!WARNING]'
              echo '> **Test build — not signed with a Developer ID and not notarized.**'
              echo '> macOS will block it on first open. After copying TetherKitNext to Applications, either'
              echo '> open *System Settings › Privacy & Security* and click **Open Anyway**, or run'
              echo '> `xattr -dr com.apple.quarantine /Applications/TetherKitNext.app`.'
              echo '> The background component may refuse to register until the app is signed with a'
              echo '> real certificate; `sudo /Applications/TetherKitNext.app/Contents/MacOS/tetherkitnext-cli`'
              echo '> works regardless.'
              echo
            fi
            sed -e "s/{{DMG_NAME}}/${dmg_name}/g" \
                -e "s/{{SHA256}}/${sha256}/g" \
                -e "s/{{TAG}}/${RELEASE_TAG}/g" \
                .github/RELEASE_TEMPLATE.md
          } > notes.md
          cat notes.md

      - name: Create release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.tag.outputs.prerelease }}
        run: |
          assets=(dist/TetherKitNext-*.dmg)
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease)
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on the commit that was just built and tested.
            flags+=(--target "$GITHUB_SHA")
          else
            flags+=(--verify-tag)
          fi
          gh release create "$RELEASE_TAG" \
            --title "TetherKitNext $RELEASE_TAG" \
            --notes-file notes.md --generate-notes \
            "${flags[@]}" "${assets[@]}"
