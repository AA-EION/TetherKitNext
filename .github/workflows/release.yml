# Release: push a v* tag to publish a signed, notarized DMG.
#
#   git tag -a v0.2.0 -m "TetherKit 0.2.0" && git push origin v0.2.0
#
# Required repository secrets for a distributable build:
#   MACOS_CERTIFICATE_P12        base64 of "Developer ID Application" cert + key (.p12)
#   MACOS_CERTIFICATE_PASSWORD   .p12 export password
#   NOTARY_KEY_P8                base64 of an App Store Connect API key (.p8)
#   NOTARY_KEY_ID                that key's ID
#   NOTARY_ISSUER_ID             App Store Connect issuer ID
# The workflow refuses to publish without them: an unsigned DMG would be
# blocked by Gatekeeper on every user's Mac.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match CMakeLists VERSION
        run: |
          tag_ver="${GITHUB_REF_NAME#v}"
          cmake_ver=$(sed -n 's/^  VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)
          echo "tag=${tag_ver} CMakeLists.txt=${cmake_ver}"
          [ "$tag_ver" = "$cmake_ver" ] || { echo "::error::tag and VERSION differ"; exit 1; }

      - name: Signing secrets present
        env:
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
          HAS_NOTARY: ${{ secrets.NOTARY_KEY_P8 != '' && secrets.NOTARY_KEY_ID != '' && secrets.NOTARY_ISSUER_ID != '' }}
        run: |
          [ "$HAS_CERT" = true ] || { echo "::error::MACOS_CERTIFICATE_P12 is not set"; exit 1; }
          [ "$HAS_NOTARY" = true ] || { echo "::error::NOTARY_* secrets are not set"; exit 1; }

      - name: Select the newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "${latest}"
          xcodebuild -version

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build, test, sign, notarize
        env:
          TETHERKIT_BUILD_NUMBER: ${{ github.run_number }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: ./scripts/build-release.sh

      - name: Swift unit tests
        run: TETHERKIT_LIB_DIR="$PWD/build-release/lib" swift test --package-path gui

      - name: Release notes
        run: |
          dmg="$(ls dist/TetherKit-*.dmg)"
          cli="$(ls dist/tetherkit-cli-*.tar.gz)"
          cat > notes.md <<EOF
          ## Install

          1. Download **$(basename "$dmg")**, open it and drag **TetherKit** to **Applications**.
          2. Open TetherKit from Applications and click **Enable Background Component**.
             macOS asks you to allow it once in *System Settings › General › Login Items*.
          3. Optional: *Settings › Command-line tool › Install Command* puts
             \`tetherkit-cli\` on your PATH (\`/usr/local/bin\`).

          Universal build: Apple Silicon and Intel, macOS 14+ (the CLI alone runs on 13.3+).
          Signed with Developer ID and notarized by Apple.

          ## Checksums (SHA-256)

          | File | SHA-256 |
          |---|---|
          | $(basename "$dmg") | \`$(shasum -a 256 "$dmg" | awk '{print $1}')\` |
          | $(basename "$cli") | \`$(shasum -a 256 "$cli" | awk '{print $1}')\` |
          EOF
          sed -i '' 's/^          //' notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "TetherKit ${GITHUB_REF_NAME}" \
            --notes-file notes.md --generate-notes --verify-tag \
            dist/TetherKit-*.dmg dist/tetherkit-cli-*.tar.gz
